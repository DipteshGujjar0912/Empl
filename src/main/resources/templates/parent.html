<!DOCTYPE html>
<html lang="en" th:fragment="base(content, title)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Document</title>
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Page Content -->
    <div id="cont">
        
        <th:block th:if="${session.loggedInUser != null and showSidebar}">
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </th:block>

        <section th:replace="${content}"></section>
        
    </div>

    <!-- Footer -->
    <th:block th:if="${session.loggedInUser == null}">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </th:block>
</body>
</html>
