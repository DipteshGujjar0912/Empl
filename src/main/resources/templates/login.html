<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: base(~{::#content}, ~{::title})}">
<head>
    <title>Login | EMS</title>
</head>

<body>
<div id="content">

    <div class="login-wrapper">

        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to your account</p>

            <p class="success" th:if="${success}" th:text="${success}"></p>
            <p class="error" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/do-login}" method="post" novalidate>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email">
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password">
                </div>

                <div class="login-options">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <p class="register-link">
                Don’t have an account? <a th:href="@{/register}">Register</a>
            </p>
        </div>

    </div>
<style>
    /* LOGIN WRAPPER */
.login-wrapper {
    margin-top: 65px;
    width: 100%;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

/* CARD */
.login-card {
    width: 100%;
    max-width: 400px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 16px;
    padding: 35px 30px;
    color: white;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.login-card h2 {
    margin-bottom: 5px;
}

.error {
    color: #ff4d4d;
    text-align: center;
    margin-bottom: 10px;
}

.success {
    color: #22c55e;
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 14px;
    margin-bottom: 25px;
    color: #ddd;
}

/* INPUT GROUP */
.input-group {
    text-align: left;
    margin-bottom: 18px;
}

.input-group label {
    font-size: 13px;
    display: block;
    margin-bottom: 5px;
}

.input-group input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

.input-group input::placeholder {
    color: #ddd;
}

/* OPTIONS */
.login-options {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 20px;
}

.login-options a {
    color: #fff;
    text-decoration: none;
}

.login-options a:hover {
    text-decoration: underline;
}

/* BUTTON */
.btn-login {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: black;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.btn-login:hover {
    background: #0ea5e9;
}

/* REGISTER LINK */
.register-link {
    margin-top: 15px;
    font-size: 13px;
}

.register-link a {
    color: #38bdf8;
    text-decoration: none;
}

.register-link a:hover {
    text-decoration: underline;
}

/* RESPONSIVE */
@media(max-width: 500px) {
    .login-card {
        padding: 25px 20px;
    }
}
</style>
</div>
</body>
</html>
