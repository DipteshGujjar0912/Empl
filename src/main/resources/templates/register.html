<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: base(~{::#content}, ~{::title})}">
<head>
    <title>Register Organization | EMS</title>
</head>

<body>
<div id="content">

    <div class="register-wrapper">

        <div class="register-card">
            <h2>Register Organization</h2>
            <p class="subtitle">Create your organization account</p>

            <!-- SUCCESS / ERROR -->
            <p style="text-align: center; font-size: 18px; padding-bottom: 4px;" class="success" th:if="${success}" th:text="${success}"></p>
            <p style="text-align: center; font-size: 18px; padding-bottom: 4px;" class="error" th:if="${error}" th:text="${error}"></p>

            <form th:action="@{/do-register}" th:object="${org}" method="post">

                <div class="form-grid">

                    <!-- ORG NAME -->
                    <div class="input-group">
                        <label>Organization Name</label>
                        <input type="text" th:field="*{orgName}">
                        <small class="error" th:if="${#fields.hasErrors('orgName')}" th:errors="*{orgName}"></small>
                    </div>

                    <!-- ORG ID -->
                    <div class="input-group">
                        <label>Organization ID</label>
                        <input type="text" th:field="*{orgUniqueId}">
                        <small class="error" th:errors="*{orgUniqueId}"></small>
                    </div>

                    <!-- EMAIL -->
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" th:field="*{email}">
                        <small class="error" th:errors="*{email}"></small>
                    </div>

                    <!-- CONTACT -->
                    <div class="input-group">
                        <label>Contact</label>
                        <input type="text" th:field="*{contact}">
                        <small class="error" th:errors="*{contact}"></small>
                    </div>

                    <!-- TYPE -->
                    <div class="input-group">
                        <label>Organization Type</label>
                        <select th:field="*{type}">
                            <option value="">Select type</option>
                            <option value="college">College</option>
                            <option value="company">Company</option>
                            <option value="school">School</option>
                        </select>
                        <small class="error" th:errors="*{type}"></small>
                    </div>

                    <!-- ADDRESS -->
                    <div class="input-group">
                        <label>Address</label>
                        <input type="text" th:field="*{address}">
                        <small class="error" th:errors="*{address}"></small>
                    </div>

                    <!-- PASSWORD -->
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" th:field="*{password}">
                        <small class="error" th:errors="*{password}"></small>
                    </div>

                    <!-- CONFIRM PASSWORD -->
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" th:field="*{confirmPassword}">
                        <small class="error" th:errors="*{confirmPassword}"></small>
                    </div>

                </div>

                <button type="submit" class="btn-register2">Register</button>

            </form>

            <p class="login-link">
                Already have an account? <a th:href="@{/login}">Login</a>
            </p>

        </div>

    </div>
<style>
    /* WRAPPER */
.register-wrapper {
    width: 100%;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #4f46e5, #9333ea);
    margin-top: 65px;
}

/* CARD */
.register-card {
    width: 100%;
    max-width: 700px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border-radius: 16px;
    padding: 35px;
    color: white;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

.register-card h2 {
    text-align: center;
}

/* ERROR */
.error {
    color: #ff6b6b;
    font-size: 12px;
}

/* SUCCESS */
.success {
    color: #4ade80;
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    font-size: 14px;
    margin-bottom: 25px;
    color: #ddd;
}

/* GRID */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

/* INPUT */
.input-group {
    display: flex;
    flex-direction: column;
}

.input-group label {
    font-size: 13px;
    margin-bottom: 5px;
}

.input-group input,
.input-group select {
    padding: 10px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.2);
    color: rgb(0, 0, 0);
}

/* BUTTON */
.btn-register2 {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: black;
    font-weight: 600;
    cursor: pointer;
}

.btn-register2:hover {
    background: #0ea5e9;
}

/* LOGIN LINK */
.login-link {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
}

.login-link a {
    color: #38bdf8;
    text-decoration: none;
}

/* RESPONSIVE */
@media(max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</div>
</body>
</html>
