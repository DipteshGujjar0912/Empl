<!DOCTYPE html>
<html lang="en" th:replace="~{parent :: base(~{::#content}, ~{::title})}">
<head>
    <title>Contact | EMS</title>
</head>

<body>
<div id="content">

    <!-- HERO -->
    <section class="contact-hero">
        <h1>Contact Us</h1>
        <p>We’d love to hear from you. Get in touch with us.</p>
    </section>

    <!-- CONTACT SECTION -->
    <section class="contact-section">

        <div class="contact-container">

            <!-- FORM -->
            <div class="contact-form">
                <h2>Send Message</h2>

                <input type="text" placeholder="Full Name">
                <input type="email" placeholder="Email Address">
                <textarea placeholder="Your Message"></textarea>

                <button class="btn-send">Send Message</button>
            </div>

            <!-- INFO -->
            <div class="contact-info">
                <h2>Contact Info</h2>

                <p><strong>Email:</strong> support@ems.com</p>
                <p><strong>Phone:</strong> +91 98765 43210</p>
                <p><strong>Location:</strong> India</p>

                <div class="contact-social">
                    <a href="#">🌐</a>
                    <a href="#">📘</a>
                    <a href="#">🐦</a>
                    <a href="#">📸</a>
                </div>
            </div>

        </div>

    </section>
<style>
    /* HERO */
.contact-hero {
    background: linear-gradient(135deg, #2563eb, #1e3a8a);
    color: white;
    text-align: center;
    padding: 70px 20px;
    margin-top: 65px;
}

.contact-hero h1 {
    font-size: 34px;
    margin-bottom: 10px;
}

.contact-hero p {
    font-size: 16px;
}

/* CONTACT SECTION */
.contact-section {
    padding: 50px 20px;
    background: #f8fafc;
}

.contact-container {
    max-width: 1000px;
    margin: auto;
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
}

/* FORM */
.contact-form {
    flex: 1;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.contact-form h2 {
    margin-bottom: 20px;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
}

.contact-form textarea {
    height: 120px;
    resize: none;
}

/* BUTTON */
.btn-send {
    width: 100%;
    padding: 12px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
}

.btn-send:hover {
    background: #1e40af;
}

/* INFO */
.contact-info {
    flex: 1;
    background: #0f172a;
    color: white;
    padding: 30px;
    border-radius: 12px;
}

.contact-info h2 {
    margin-bottom: 20px;
}

.contact-info p {
    margin-bottom: 10px;
}

/* SOCIAL */
.contact-social {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.contact-social a {
    background: #1e293b;
    padding: 8px 12px;
    border-radius: 6px;
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

.contact-social a:hover {
    background: #38bdf8;
    color: black;
}

/* RESPONSIVE */
@media(max-width: 768px) {
    .contact-container {
        flex-direction: column;
    }
}
</style>
</div>
</body>
</html>
